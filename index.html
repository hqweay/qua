<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      CSP：本地应用只需要自己的脚本、样式，以及 data: 与 blob: 两种图片。
      · style-src 的 'unsafe-inline' 用于首屏 color-scheme 兜底与 Vite 注入的样式；
      · img-src 的 blob: 是**行内资产的唯一来源**：字节从资产库读出来是 Blob，
        经 `URL.createObjectURL` 变成 blob URL 才能给 <img>。少了它，真实图片会被
        浏览器静默拦下（console 里只有一条 error，页面上是一片空白）。
      · connect-src 的 ws 仅给 dev server 的 HMR 用（端口固定 5180）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: qua-asset:; font-src 'self'; connect-src 'self' ws://127.0.0.1:5180; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!--
      首屏兜底：在 styles.css / main.ts 到位**之前**就按系统外观定色，冷启动不闪。
      最小内联 `color-scheme` —— 零颜色字面量、零脚本；真正的三档主题由 styles.css 的
      `color-scheme` ＋ `light-dark()` 接过去（跟随系统 / 亮 / 暗）。
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
    </style>
    <link rel="icon" href="data:," />
    <!-- 文案为空壳：一切用户可见文案由 src/msg.ts 在启动时灌入 -->
    <title></title>
  </head>
  <body>
    <!-- 启动级持久告警（数据只读 / 保存失败）；默认隐藏，文案由 msg.ts 灌入 -->
    <div id="boot-notice" class="boot-notice" role="status" hidden></div>
    <div id="app">
      <!--
        三槽并排（2026-10-19 晚修订：**入口条已作废**）
          `槽(left) ｜ 槽(center) ｜ 槽(right)`
        · 三槽**同一种材质**，只靠一条分隔线分家（不是「侧栏灰 + 正文白」）
        · 槽的开关与「这一槽放什么」都归槽自己（抬头上的左右箭头，⌘⌥1 / ⌘⌥2）
        · 每个槽的内容 = **一列块**；这里只放空壳，块由 dock.ts 渲染
        · 中心槽没有「页标题」这个概念
      -->
      <section class="dock" id="dock-left" data-dock="left">
        <div class="dock-head">
          <span class="dock-title" id="dock-left-title"></span>
          <span class="dock-sp"></span>
          <button class="dock-btn dock-add" id="dock-left-add" type="button"></button>
          <button class="dock-btn dock-collapse" id="dock-left-collapse" type="button"></button>
        </div>
        <div class="dock-stack" id="dock-left-stack"></div>
        <!-- 内侧边缘的宽度手柄：位置（哪条边）由 JS 按 side 标，样式只读 token -->
        <div class="dock-resize"></div>
      </section>

      <!--
        中心槽（2026-10-20 修订）：**没有顶栏**。
          · 甲乙丙／明暗切换是调试开关，已挪进调试菜单（`window.__qua` 与 `#state-menu-btn`）
            —— 正式软件不需要它们常驻；
          · 格式类命令改由划选气泡承载（见 `bindings.ts` 的 `selection` 段），不再常驻；
          · 于是顶栏里什么都不剩了 ⇒ **整个 `#topbar` 撤掉**，不为没有内容的容器留高度。
          · **文档头只剩面包屑**：`#crumbs`（页图标＋页名）
            整个撤掉 —— 它此前兼任「标题」，既与「中心槽没有页标题」冲突，又让那个位置**不可编辑**。
            页 / 日记 / 被 zoom 的块，一律是**正文第一行**（`rootsFor()` 装进编辑器）。
      -->
      <main class="dock" id="dock-center" data-dock="center">
        <div id="scroll">
          <div id="doc">
            <!-- 面包屑：顶层时 hidden（不占高度）；点一格＝聚焦到该祖先（＝退回） -->
            <div id="crumbs-trail" hidden></div>
            <div id="editor" spellcheck="false"></div>
            <!--
              块底的挂载区（引用／同类／提及 ＋ 用户配的查询）**不在这里**：
              它是**每一段**末尾的 chrome —— 编辑器在段尾留一个空槽（`.sec-mount`），
              装配层按段根把实例挂进去。静态模板放一份就只能属于某一段。
              「点开查询块看结果」同理：那一段的槽里会先有一份查询视图。
            -->
            <div id="empty-hint" hidden></div>
          </div>
        </div>
      </main>

      <section class="dock" id="dock-right" data-dock="right">
        <div class="dock-head">
          <span class="dock-title" id="dock-right-title"></span>
          <span class="dock-sp"></span>
          <button class="dock-btn dock-add" id="dock-right-add" type="button"></button>
          <button class="dock-btn dock-collapse" id="dock-right-collapse" type="button"></button>
        </div>
        <div class="dock-stack" id="dock-right-stack">
          <!--
            检视卡：内容**跟着中心槽的当前对象**走（不是光标所在行）。
            它是右槽的常驻节点（`renderDockStack` 的 persistent），因为里面是表单：
            重画整槽会把正在输入的控件换掉、丢焦点与光标。
            形状与钉住区同一套卡（`.dock-card`），但主体来源不同：
            钉住区的主体是卡片自带的块 id，这张卡的主体是 `activeId`。
          -->
          <div class="dock-card" id="inspect-card" data-inspect-card hidden>
            <div class="dock-card-head">
              <span class="dock-card-title" id="inspect-card-title"></span>
            </div>
            <div class="dock-card-body">
              <div class="properties-body" id="properties-body"></div>
              <!--
                添加入口在**体**里、不在卡头：卡头只放卡级控件（收起／单卡／关闭），
                每张卡同构；作用于内容的动作贴着内容长（与日历「点月份回本月」同一条口径）。
              -->
              <button class="props-add" id="properties-add" type="button"></button>
            </div>
          </div>
        </div>
        <div class="dock-resize"></div>
      </section>
    </div>

    <!-- 浮层 -->
    <div id="overlay" hidden></div>
    <div id="popover" hidden></div>

    <!-- 右下角状态角标 -->
    <div id="badge"></div>
    <div id="badge-panel" hidden></div>

    <!-- 演示状态菜单的锚点（原来在左栏页脚，入口条作废后移到这里） -->
    <button id="state-menu-btn" class="ghost" hidden type="button"></button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
